name: Keypad mod release

# Push a tag like v3.2.59-1-keypad1 - or run this workflow by hand and type the tag -
# to build the Android APKs of the keypad mod and publish them as a GitHub release.
on:
  push:
    tags:
      - "v*-keypad*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v3.2.59-1-keypad1 (created if missing)"
        required: true

permissions:
  contents: write

concurrency:
  group: keypad-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish APKs
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"; else TAG="$GITHUB_REF_NAME"; fi
          if ! [[ "$TAG" =~ ^v[0-9][0-9A-Za-z.-]*-keypad[0-9A-Za-z.]*$ ]]; then
            echo "::error::Tag '$TAG' should look like v3.2.59-1-keypad1"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Sources of zlib, libpng, freetype, harfbuzz... the native build needs.
      - name: Fetch third-party sources
        run: ./thirdparty-deploy.sh

      - name: Build release APKs
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Sign APKs
        shell: bash
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KS"
            export KS_PASS="$SIGNING_STORE_PASSWORD" KEY_PASS="$SIGNING_KEY_PASSWORD"
            ALIAS="$SIGNING_KEY_ALIAS"
          else
            echo "::warning::SIGNING_* secrets are not set; the APKs are signed with a throwaway key and cannot update an already installed copy."
            export KS_PASS=android KEY_PASS=android
            ALIAS=androiddebugkey
            keytool -genkeypair -keystore "$KS" -storepass "$KS_PASS" -keypass "$KEY_PASS" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p dist
          # The release build type has no signing config, so Gradle leaves the APKs unsigned.
          find android/app/build -name "*-release-unsigned.apk" | sort -u | while read -r f; do
            abi="$(basename "$f" | sed -E 's/^app-(.*)-release-unsigned\.apk$/\1/')"
            out="dist/CoolReader-${VERSION}-${abi}.apk"
            [ -e "$out" ] && continue
            "$BT/apksigner" sign --ks "$KS" --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
              --ks-key-alias "$ALIAS" --out "$out" "$f"
          done
          rm -f dist/*.idsig
          ls -la dist
          test -n "$(ls dist/*.apk 2>/dev/null)"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Cool Reader ${{ steps.tag.outputs.version }} (keypad mod)
          body: |
            Unofficial Cool Reader build for keypad Android phones (alexbeatnik's mod).
            See the README for what it changes. Most phones need the `arm64-v8a` APK;
            `universal` works everywhere but is larger.
          generate_release_notes: true
          prerelease: false
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
